version: 2

sources:
  - name: bronze
    description: >
      Parquet bronze (tudo varchar + metadados de ingestão), particionado
      por ano/mês/tipo. Layout oficial do TXT: competênciamov, seção,
      saldomovimentação, salário, etc.
    schema: main
    tables:
      - name: caged_mov
        description: Microdados MOV/FOR/EXC já convertidos para Parquet.
        meta:
          external_location: "read_parquet('{{ var('bronze_glob') }}', hive_partitioning=true, union_by_name=true)"
