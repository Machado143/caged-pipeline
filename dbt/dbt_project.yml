name: caged
version: "1.0.0"
config-version: 2
profile: caged

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  bronze_glob: "../data/bronze/**/*.parquet"

models:
  caged:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  caged:
    +schema: seeds
