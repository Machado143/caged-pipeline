[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caged-pipeline"
version = "0.1.0"
description = "Pipeline medallion do CAGED: extract, load, dbt, forecast e dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "py7zr>=0.21",
  "pyarrow>=16.0",
  "pandas>=2.2",
  "streamlit>=1.38",
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
orch = [
  "prefect>=3.0",
]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
